<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS — Educational AI Assistant</title>
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #100626 0%, #04060a 100%);
      --card-bg: rgba(18, 18, 30, 0.85);
      --card-border: rgba(0, 212, 255, 0.35);
      --text-main: #e0f7fa;
      --text-sub: #00d4ff;
      --msg-user-bg: linear-gradient(135deg, rgba(0, 212, 255, 0.35), rgba(112, 0, 255, 0.35));
      --msg-bot-bg: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(0, 0, 0, 0.6);
      --accent-glow: 0 0 20px rgba(0, 212, 255, 0.5);
      --btn-bg: linear-gradient(135deg, #00d4ff, #7000ff);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text-main);
    }

    /* Floating JARVIS Elements Overlay */
    .overlay-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      overflow: hidden;
    }

    .fg-jarvis-orb-1 {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      border: 2px dashed var(--text-sub);
      opacity: 0.25;
      animation: floatOrbit 18s ease-in-out infinite alternate;
    }

    @keyframes floatOrbit {
      0% { transform: translate3d(-10vw, -10vh, 0) rotate(0deg); }
      100% { transform: translate3d(40vw, 30vh, 0) rotate(360deg); }
    }

    /* Fullscreen Mobile Flex Layout */
    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* Dynamic viewport height for mobile browsers */
      max-width: 900px;
      margin: 0 auto;
      padding: 10px;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .jarvis-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-title {
      font-weight: bold;
      color: var(--text-sub);
      font-size: 1.1rem;
    }

    /* Strictly Fixed Scroll Box */
    .chat-box {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 85%;
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background: var(--msg-user-bg);
      border: 1px solid var(--card-border);
    }

    .bot-msg {
      align-self: flex-start;
      background: var(--msg-bot-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .input-container {
      padding: 12px;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      background: rgba(0, 0, 0, 0.2);
    }

    input[type="text"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }

    .send-btn {
      background: var(--btn-bg);
      border: none;
      color: #fff;
      font-weight: bold;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="fg-jarvis-orb-1"></div>
  </div>

  <div class="app-layout">
    <div class="glass-card">
      <div class="jarvis-header">
        <span class="header-title">J.A.R.V.I.S.</span>
        <span style="font-size: 0.75rem; color: var(--text-sub);">Online</span>
      </div>

      <!-- Scrolling container -->
      <div class="chat-box" id="chatBox">
        <div class="message bot-msg">Greetings! How may I assist your studies today?</div>
      </div>

      <div class="input-container">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button class="send-btn" onclick="sendQuery()">Send</button>
      </div>
    </div>
  </div>

  <script>
    async function sendQuery() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessageUI(text, 'user-msg');
      input.value = '';

      try {
        const response = await fetch('/api/jarvis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();

        if (response.status === 429 || (data.error && data.error.includes("429"))) {
          appendMessageUI("⚠️ Quota limit reached for free tier. Please wait 1-2 minutes before sending another message.", 'bot-msg');
        } else {
          appendMessageUI(data.reply || data.error || "System responded.", 'bot-msg');
        }

      } catch (err) {
        appendMessageUI("Central command connection failed.", 'bot-msg');
      }
    }

    function appendMessageUI(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      
      // Forces immediate scroll to newest message
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
