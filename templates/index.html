<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>JARVIS — Educational AI Assistant</title>

  <!-- DEBUG BANNER: shows JavaScript problems on screen. Delete this whole script block once everything works. -->
  <script>
    (function () {
      function banner(msg) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;padding:10px;font:13px/1.4 monospace;white-space:pre-wrap;word-break:break-word';
        d.textContent = msg;
        document.documentElement.appendChild(d);
      }
      window.addEventListener('error', function (e) {
        banner('JS error: ' + e.message + '\nLine ' + e.lineno + ', column ' + e.colno);
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__jarvisReady) {
            banner('The main script did not finish starting. index.html may be cut off or edited.');
          } else if (typeof html2pdf === 'undefined') {
            banner('The PDF library did not load. Check your internet or ad blocker.');
          }
        }, 1500);
      });
    })();
  </script>

  <!-- PDF engine (runs in the browser, free, no server load) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #100626 0%, #04060a 100%);
      --card-bg: rgba(18, 18, 30, 0.85);
      --card-border: rgba(0, 212, 255, 0.35);
      --text-main: #e0f7fa;
      --text-sub: #00d4ff;
      --msg-user-bg: linear-gradient(135deg, rgba(0, 212, 255, 0.35), rgba(112, 0, 255, 0.35));
      --msg-user-border: rgba(0, 212, 255, 0.5);
      --msg-bot-bg: rgba(255, 255, 255, 0.08);
      --msg-bot-border: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(0, 0, 0, 0.6);
      --accent-glow: 0 0 25px rgba(0, 212, 255, 0.6);
      --btn-bg: linear-gradient(135deg, #00d4ff, #7000ff);
      --btn-text: #ffffff;
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 20%, #e0c3fc 0%, #8ec5fc 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-main: #1e1e2f;
      --text-sub: #4a00e0;
      --msg-user-bg: linear-gradient(135deg, #8e2de2, #4a00e0);
      --msg-user-border: rgba(142, 45, 226, 0.3);
      --msg-bot-bg: rgba(255, 255, 255, 0.9);
      --msg-bot-border: rgba(255, 255, 255, 0.95);
      --input-bg: rgba(255, 255, 255, 0.9);
      --accent-glow: 0 0 20px rgba(142, 45, 226, 0.4);
      --btn-bg: linear-gradient(135deg, #8e2de2, #4a00e0);
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text-main);
    }

    /* Animated Circles */
    .overlay-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fg-jarvis-orb-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      top: 10%;
      left: 10%;
      border-radius: 50%;
      border: 2px dashed var(--text-sub);
      opacity: 0.25;
      animation: floatLoop1 20s linear infinite;
    }

    .fg-jarvis-orb-2 {
      position: absolute;
      width: 200px;
      height: 200px;
      bottom: 15%;
      right: 10%;
      border-radius: 50%;
      border: 2px dotted rgba(112, 0, 255, 0.7);
      opacity: 0.3;
      animation: floatLoop2 16s linear infinite;
    }

    @keyframes floatLoop1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30vw, 20vh) rotate(120deg); }
      66% { transform: translate(-10vw, 40vh) rotate(240deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }

    @keyframes floatLoop2 {
      0% { transform: translate(0, 0) rotate(360deg); }
      33% { transform: translate(-25vw, -30vh) rotate(240deg); }
      66% { transform: translate(15vw, -15vh) rotate(120deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .app-layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      display: flex;
      gap: 12px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      border-radius: 20px;
    }

    .history-panel {
      width: 260px;
      display: flex;
      flex-direction: column;
      padding: 16px;
      flex-shrink: 0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      color: var(--text-sub);
    }

    .new-chat-btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: var(--accent-glow);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }

    .history-item:hover, .history-item.active {
      border-color: var(--card-border);
      background: rgba(255, 255, 255, 0.15);
    }

    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }

    .jarvis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .arc-reactor {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px dashed var(--text-sub);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--accent-glow);
      animation: spinReactor 12s linear infinite;
    }

    .arc-core {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--btn-bg);
      box-shadow: var(--accent-glow);
      animation: pulseCore 2s ease-in-out infinite alternate;
    }

    @keyframes spinReactor { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseCore { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.1); opacity: 1; } }

    .controls { display: flex; gap: 6px; flex-wrap: wrap; }

    .theme-btn, .voice-btn, .clear-btn, .mobile-history-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    /* PDF color theme picker */
    .pdf-theme-select {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
      outline: none;
    }

    .pdf-theme-select option { color: #1e1e2f; }

    .mobile-history-btn { display: none; }

    .chat-box {
      flex: 1 1 0%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 6px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 85%;
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .message-text { white-space: pre-wrap; }

    .user-msg {
      align-self: flex-end;
      background: var(--msg-user-bg);
      border: 1px solid var(--msg-user-border);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot-msg {
      align-self: flex-start;
      background: var(--msg-bot-bg);
      border: 1px solid var(--msg-bot-border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    /* Make PDF button under each Jarvis answer */
    .pdf-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 9px 14px;
      background: var(--btn-bg);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: var(--accent-glow);
      transition: transform 0.2s ease;
    }

    .pdf-btn:active { transform: scale(0.96); }
    .pdf-btn:disabled { opacity: 0.7; cursor: wait; }

    .input-container {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      outline: none;
      font-size: 1rem;
      min-width: 0;
    }

    .mic-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .mic-btn.listening {
      background: #ff4757;
      border-color: #ff6b81;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.8);
      animation: pulseMic 1s infinite alternate;
    }

    @keyframes pulseMic {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .send-btn {
      background: var(--btn-bg);
      border: none;
      color: var(--btn-text);
      font-weight: bold;
      padding: 0 16px;
      flex-shrink: 0;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: var(--accent-glow);
    }

    .history-actions { display: flex; gap: 6px; }
    .mobile-close-btn { display: none; }

    /* Tablets */
    @media (max-width: 900px) {
      .history-panel { width: 220px; }
    }

    /* Phones and small tablets */
    @media (max-width: 768px) {
      .app-layout {
        padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      }
      .chat-section { padding: 12px; border-radius: 16px; }
      .mobile-history-btn { display: block; }
      .mobile-close-btn { display: block; }

      /* Chat list opens as a full-screen sheet with its own Close button */
      .history-panel {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: none;
        border-radius: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      }
      .history-panel.active { display: flex; }

      /* Header buttons share one tidy row with bigger tap targets */
      .controls { width: 100%; }
      .controls > * { flex: 1 1 auto; text-align: center; min-height: 36px; }

      .message { max-width: 92%; font-size: 0.95rem; }
      .fg-jarvis-orb-1 { width: 180px; height: 180px; }
      .fg-jarvis-orb-2 { width: 120px; height: 120px; }
    }

    /* Small phones */
    @media (max-width: 380px) {
      .theme-btn, .voice-btn, .clear-btn, .mobile-history-btn, .pdf-theme-select {
        font-size: 0.72rem;
        padding: 6px 8px;
      }
      .input-container { gap: 6px; }
      .send-btn { padding: 0 12px; }
      .mic-btn { padding: 0 11px; }
    }

    /* Phones held sideways: save vertical space */
    @media (max-height: 500px) and (orientation: landscape) {
      .jarvis-header { padding-bottom: 6px; gap: 6px; }
      .arc-reactor { width: 30px; height: 30px; }
      .arc-core { width: 13px; height: 13px; }
      .header-left p { display: none; }
      .chat-box { margin: 8px 0; }
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="fg-jarvis-orb-1"></div>
    <div class="fg-jarvis-orb-2"></div>
  </div>

  <div class="app-layout">
    <div class="glass-card history-panel" id="historyPanel">
      <div class="history-header">
        <span>Chat Sessions</span>
        <div class="history-actions">
          <button class="clear-btn" onclick="clearAllSessions()">Clear All</button>
          <button class="clear-btn mobile-close-btn" onclick="toggleMobileHistory()">✕ Close</button>
        </div>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="glass-card chat-section">
      <div class="jarvis-header">
        <div class="header-left">
          <div class="arc-reactor">
            <div class="arc-core"></div>
          </div>
          <div>
            <h2 style="font-size: 1.05rem;">J.A.R.V.I.S.</h2>
            <p style="font-size: 0.72rem; color: var(--text-sub);">Educational Intelligence</p>
          </div>
        </div>
        <div class="controls">
          <select class="pdf-theme-select" id="pdfThemeSelect" onchange="setPdfTheme(this.value)" title="Colors for your PDF notes">
            <option value="ocean">🎨 Ocean</option>
            <option value="sunset">🎨 Sunset</option>
            <option value="forest">🎨 Forest</option>
            <option value="grape">🎨 Grape</option>
          </select>
          <button class="voice-btn" onclick="toggleVoice()" id="voiceToggleBtn">🔊 Voice ON</button>
          <button class="mobile-history-btn" onclick="toggleMobileHistory()">📜 Chats</button>
          <button class="theme-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light</button>
        </div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-container">
        <input type="text" id="userInput" placeholder="Ask any question..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button class="mic-btn" id="micBtn" onclick="startListening()" title="Speak to JARVIS">🎤</button>
        <button class="send-btn" onclick="sendQuery()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = null;
    let voiceEnabled = true;
    let recognition = null;

    /* Speech Recognition Setup (User Speech Input) */
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        const micBtn = document.getElementById('micBtn');
        micBtn.classList.add('listening');
        micBtn.title = "Listening...";
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        sendQuery();
      };

      recognition.onerror = function() {
        stopMicUI();
      };

      recognition.onend = function() {
        stopMicUI();
      };
    }

    function startListening() {
      if (!recognition) {
        alert("Speech recognition is not supported on this browser.");
        return;
      }
      try {
        recognition.start();
      } catch (e) {
        recognition.stop();
      }
    }

    function stopMicUI() {
      const micBtn = document.getElementById('micBtn');
      micBtn.classList.remove('listening');
      micBtn.title = "Speak to JARVIS";
    }

    window.onload = function() {
      document.getElementById('pdfThemeSelect').value = getPdfThemeKey();

      let sessions = getSessions();
      if (sessions.length === 0) {
        startNewChat();
      } else {
        loadSession(sessions[0].id);
      }
    };

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const voiceBtn = document.getElementById('voiceToggleBtn');
      if (voiceEnabled) {
        voiceBtn.textContent = '🔊 Voice ON';
        voiceBtn.style.opacity = '1';
      } else {
        voiceBtn.textContent = '🔇 Muted';
        voiceBtn.style.opacity = '0.6';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function toggleMobileHistory() {
      document.getElementById('historyPanel').classList.toggle('active');
    }

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('themeToggleBtn');
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        themeBtn.textContent = '☀️ Light';
      } else {
        body.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙 Dark';
      }
    }

    function getSessions() {
      return JSON.parse(localStorage.getItem('jarvis_sessions') || '[]');
    }

    function saveSessions(sessions) {
      localStorage.setItem('jarvis_sessions', JSON.stringify(sessions));
      renderHistoryList();
    }

    function startNewChat() {
      currentSessionId = 'session_' + Date.now();
      let sessions = getSessions();
      const initialGreeting = 'Greetings! I am JARVIS. How may I assist your studies today?';
      sessions.unshift({
        id: currentSessionId,
        title: 'New Conversation',
        messages: [{ sender: 'bot', text: initialGreeting }]
      });
      saveSessions(sessions);
      loadSession(currentSessionId);
      if (window.innerWidth <= 768) {
        document.getElementById('historyPanel').classList.remove('active');
      }
    }

    function loadSession(id) {
      currentSessionId = id;
      let sessions = getSessions();
      let session = sessions.find(s => s.id === id);
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      if (session) {
        session.messages.forEach((msg, i) => {
          if (msg.sender === 'user') {
            appendMessageUI(msg.text, 'user-msg');
            return;
          }
          const prev = session.messages[i - 1];
          // Older saved answers have no flag: treat long replies as real answers
          const canPdf = msg.canPdf !== undefined ? msg.canPdf : (i > 0 && msg.text.length > 150);
          appendMessageUI(msg.text, 'bot-msg', {
            canPdf: canPdf,
            topic: prev && prev.sender === 'user' ? prev.text : ''
          });
        });
      }
      renderHistoryList();
    }

    async function sendQuery() {
      const inputField = document.getElementById('userInput');
      const text = inputField.value.trim();
      if (!text) return;

      appendMessageUI(text, 'user-msg');
      saveMessageToSession(text, 'user');
      inputField.value = '';

      try {
        const response = await fetch('/api/jarvis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        const rawResponse = JSON.stringify(data);

        if (response.status === 429 || rawResponse.includes("429") || rawResponse.includes("RESOURCE_EXHAUSTED")) {
          const quotaText = "JARVIS is recharging.";
          appendMessageUI(quotaText, 'bot-msg');
          saveMessageToSession(quotaText, 'bot');
          speak(quotaText);
          return;
        }

        const reply = data.reply || data.error || "Systems standard response.";
        const isRealAnswer = response.ok;

        appendMessageUI(reply, 'bot-msg', { canPdf: isRealAnswer, topic: text });
        saveMessageToSession(reply, 'bot', isRealAnswer);
        speak(reply);

      } catch (err) {
        const errorMsg = "Central command connection failed.";
        appendMessageUI(errorMsg, 'bot-msg');
        speak(errorMsg);
      }
    }

    function appendMessageUI(text, className, opts = {}) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;

      let content = document.createElement('div');
      content.className = 'message-text';
      content.textContent = text;
      msgDiv.appendChild(content);

      if (opts.canPdf) {
        const pdfBtn = document.createElement('button');
        pdfBtn.className = 'pdf-btn';
        pdfBtn.textContent = '📄 Make colorful PDF';
        pdfBtn.onclick = () => makePdf(pdfBtn, opts.topic || '', text);
        msgDiv.appendChild(pdfBtn);
      }

      chatBox.appendChild(msgDiv);

      setTimeout(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 50);
    }

    function saveMessageToSession(text, sender, canPdf) {
      let sessions = getSessions();
      let session = sessions.find(s => s.id === currentSessionId);
      if (session) {
        if (session.title === 'New Conversation' && sender === 'user') {
          session.title = text.length > 28 ? text.substring(0, 28) + '...' : text;
        }
        session.messages.push({ sender, text, canPdf });
        saveSessions(sessions);
      }
    }

    function renderHistoryList() {
      const historyList = document.getElementById('historyList');
      if (!historyList) return;
      let sessions = getSessions();
      historyList.innerHTML = '';

      sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
        div.textContent = s.title;
        div.onclick = () => {
          loadSession(s.id);
          if (window.innerWidth <= 768) {
            document.getElementById('historyPanel').classList.remove('active');
          }
        };
        historyList.appendChild(div);
      });
    }

    function clearAllSessions() {
      localStorage.removeItem('jarvis_sessions');
      startNewChat();
    }

    /* ============================================================
       COLORFUL PDF NOTES
       1. Button calls /api/notes  -> Gemini returns structured JSON
       2. buildNotesHtml() fills a colorful template with that JSON
       3. html2pdf turns the template into a downloadable A4 PDF
       ============================================================ */

    const PDF_THEMES = {
      ocean:  ['#0369A1', '#0F766E', '#B45309', '#6D28D9'],
      sunset: ['#D62839', '#C2570C', '#9D174D', '#0F766E'],
      forest: ['#2D6A4F', '#0F766E', '#A16207', '#6B4C9A'],
      grape:  ['#6D28D9', '#BE185D', '#0369A1', '#15803D']
    };

    function getPdfThemeKey() {
      const saved = localStorage.getItem('jarvis_pdf_theme');
      return PDF_THEMES[saved] ? saved : 'ocean';
    }

    function setPdfTheme(key) {
      if (PDF_THEMES[key]) localStorage.setItem('jarvis_pdf_theme', key);
    }

    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function hexToRgba(hex, alpha) {
      const n = parseInt(hex.slice(1), 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    function slugify(title) {
      const slug = String(title || '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 50);
      return slug || 'jarvis-notes';
    }

    function buildNotesHtml(n, colors) {
      const C = colors;
      const tint = (i, a = 0.09) => hexToRgba(C[i % C.length], a);
      const icons = ['📘', '📗', '📙', '📕', '📓', '📒'];
      const serif = "Georgia, 'Times New Roman', serif";
      const mono = "Consolas, 'Courier New', monospace";
      const today = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });

      const bullets = (list, color) => (list || []).map(p => `
        <div style="position:relative;padding-left:16px;margin:4px 0;">
          <span style="position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:${color};"></span>
          ${esc(p)}
        </div>`).join('');

      const blockTitle = (icon, text, color) => `
        <div style="font-family:${serif};font-size:17px;font-weight:bold;color:${color};border-bottom:2.5px solid ${color};padding-bottom:4px;margin-bottom:8px;">
          ${icon} ${esc(text)}
        </div>`;

      const cover = `
        <div class="keep" style="background:${C[0]};color:#ffffff;border-radius:14px;padding:22px 24px;margin-bottom:16px;">
          <div style="font-family:${serif};font-size:28px;font-weight:bold;line-height:1.2;">${esc(n.title)}</div>
          ${n.subtitle ? `<div style="font-size:14px;margin-top:6px;">${esc(n.subtitle)}</div>` : ''}
          <div style="font-size:12px;margin-top:12px;">Study notes by Jarvis &nbsp;|&nbsp; ${esc(today)}</div>
        </div>`;

      const overview = n.overview ? `
        <div class="keep" style="border-left:6px solid ${C[0]};background:${tint(0, 0.1)};padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;">
          <b style="color:${C[0]};">In short</b>
          <div style="margin-top:3px;">${esc(n.overview)}</div>
        </div>` : '';

      const sections = (n.sections || []).map((s, i) => {
        const color = C[i % C.length];
        return `
        <div class="keep" style="margin-bottom:16px;">
          <div style="background:${color};color:#ffffff;padding:9px 14px;border-radius:10px 10px 0 0;font-family:${serif};font-size:17px;font-weight:bold;">
            ${icons[i % icons.length]} ${esc(s.heading)}
          </div>
          <div style="border:1.5px solid ${color};border-top:none;border-radius:0 0 10px 10px;padding:12px 14px;background:${tint(i)};">
            ${s.explanation ? `<div style="margin-bottom:6px;">${esc(s.explanation)}</div>` : ''}
            ${bullets(s.points, color)}
            ${s.formula ? `
              <div style="margin-top:10px;padding:10px;text-align:center;background:#ffffff;border:1.5px solid ${color};border-radius:8px;">
                <div style="font-size:12px;font-weight:bold;color:${color};margin-bottom:4px;">Formula</div>
                <div style="font-family:${mono};font-size:15px;font-weight:bold;">${esc(s.formula)}</div>
              </div>` : ''}
            ${s.example ? `
              <div style="margin-top:10px;padding:10px 12px;background:#ffffff;border:1.5px dashed ${color};border-radius:8px;">
                <div style="font-size:12px;font-weight:bold;color:${color};margin-bottom:3px;">💡 Example</div>
                ${esc(s.example)}
              </div>` : ''}
          </div>
        </div>`;
      }).join('');

      const terms = (n.key_terms || []).length ? `
        <div class="keep" style="margin-bottom:16px;">
          ${blockTitle('🔑', 'Key terms', C[1])}
          ${n.key_terms.map((t, i) => `
            <div style="padding:5px 0;border-bottom:1px dotted #cbd5e1;">
              <b style="color:${C[i % C.length]};">${esc(t.term)}:</b> ${esc(t.meaning)}
            </div>`).join('')}
        </div>` : '';

      const remember = (n.remember || []).length ? `
        <div class="keep" style="background:${C[3]};color:#ffffff;border-radius:12px;padding:14px 16px;margin-bottom:16px;">
          <div style="font-family:${serif};font-size:17px;font-weight:bold;margin-bottom:6px;">⭐ Remember this</div>
          ${n.remember.map(r => `
            <div style="position:relative;padding-left:16px;margin:4px 0;">
              <span style="position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:#ffffff;"></span>
              ${esc(r)}
            </div>`).join('')}
        </div>` : '';

      const quiz = (n.quiz || []).length ? `
        <div class="keep" style="margin-bottom:12px;">
          ${blockTitle('🧠', 'Test yourself', C[2])}
          ${n.quiz.map((q, i) => `
            <div style="padding:6px 0;border-bottom:1px dotted #cbd5e1;">
              <div><b>Q${i + 1}.</b> ${esc(q.question)}</div>
              <div style="color:${C[2]};margin-top:2px;"><b>Answer:</b> ${esc(q.answer)}</div>
            </div>`).join('')}
        </div>` : '';

      return `
        <div style="font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13.5px;line-height:1.55;color:#1f2937;">
          ${cover}
          ${overview}
          ${sections}
          ${terms}
          ${remember}
          ${quiz}
          <div style="text-align:center;font-size:11px;color:#94a3b8;margin-top:8px;">Made with Jarvis</div>
        </div>`;
    }

    async function makePdf(btn, topic, text) {
      if (typeof html2pdf === 'undefined') {
        alert('The PDF tool did not load. Check your internet connection and refresh the page.');
        return;
      }

      const originalLabel = '📄 Make colorful PDF';
      btn.disabled = true;
      btn.textContent = '⏳ Building your notes...';

      try {
        const res = await fetch('/api/notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic: topic, text: text })
        });
        const data = await res.json();
        if (!res.ok || !data.notes) {
          throw new Error(data.reply || 'Could not build the notes.');
        }

        const colors = PDF_THEMES[getPdfThemeKey()];
        const holder = document.createElement('div');
        holder.innerHTML = buildNotesHtml(data.notes, colors);

        await html2pdf().set({
          margin: [12, 10, 14, 10],
          filename: slugify(data.notes.title) + '.pdf',
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'], avoid: '.keep' }
        }).from(holder).save();

        btn.textContent = '✅ Saved. Tap to download again';
      } catch (err) {
        console.error(err);
        btn.textContent = '⚠️ Failed. Tap to try again';
      } finally {
        btn.disabled = false;
        setTimeout(() => { btn.textContent = originalLabel; }, 4000);
      }
    }

    /* Clean raw Markdown symbols & dots so TTS speaks naturally */
    function cleanTextForSpeech(text) {
      return text
        .replace(/J\.A\.R\.V\.I\.S\.?/gi, "Jarvis")
        .replace(/\*+/g, "")
        .replace(/#+|-+|---+/g, "")
        .replace(/[`~_]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    /* Deep Male Voice TTS Function */
    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const cleanedText = cleanTextForSpeech(text);
      const utterance = new SpeechSynthesisUtterance(cleanedText);
      const voices = window.speechSynthesis.getVoices();

      // Search specifically for male voice engines
      const maleVoice = voices.find(v => 
        v.lang.startsWith('en') && (
          v.name.includes('David') || 
          v.name.includes('George') || 
          v.name.includes('Guy') || 
          v.name.includes('Mark') || 
          v.name.includes('Alex') || 
          v.name.includes('Daniel') ||
          v.name.includes('Google UK English Male') ||
          v.name.includes('Male')
        )
      ) || voices.find(v => v.lang.startsWith('en')) || voices[0];

      if (maleVoice) utterance.voice = maleVoice;

      // Pitch and rate adjusted for a deeper, natural J.A.R.V.I.S. cadence
      utterance.pitch = 0.75; 
      utterance.rate = 0.95; 

      window.speechSynthesis.speak(utterance);
    }

    // Pre-load voices asynchronously when page loads
    if (typeof speechSynthesis !== 'undefined') {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    window.__jarvisReady = true;
  </script>
