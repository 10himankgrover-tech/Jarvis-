<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Educational AI Assistant</title>
  
  <style>
    :root {
      --bg-main: #0a0b10;
      --card-bg: #121420;
      --card-border: #00d4ff44;
      --text-main: #e0f7fa;
      --text-sub: #00d4ff;
      --msg-user-bg: #1a233a;
      --msg-user-border: #00d4ff66;
      --msg-bot-bg: #161824;
      --msg-bot-border: #ffffff1a;
      --input-bg: #0d0f18;
      --btn-bg: linear-gradient(135deg, #00d4ff, #7000ff);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ultra-lightweight Hardware Animated Overlay */
    .overlay-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
    }

    .fg-jarvis-orb {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1.5px dashed var(--text-sub);
      opacity: 0.2;
      will-change: transform;
      animation: floatSmooth 18s linear infinite;
    }

    @keyframes floatSmooth {
      0% { transform: translate3d(-20vw, -10vh, 0) rotate(0deg); }
      50% { transform: translate3d(50vw, 40vh, 0) rotate(180deg); }
      100% { transform: translate3d(-20vw, -10vh, 0) rotate(360deg); }
    }

    .app-layout {
      position: relative;
      z-index: 1;
      width: 95%;
      max-width: 1000px;
      height: 92vh;
      display: flex;
      gap: 12px;
    }

    /* Optimized Solid Card (No backdrop-filter lag) */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
    }

    .history-panel {
      width: 260px;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: var(--text-sub);
      font-weight: bold;
    }

    .new-chat-btn {
      background: var(--btn-bg);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 10px;
      background: #ffffff0a;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item.active {
      background: #ffffff1f;
      border: 1px solid var(--card-border);
    }

    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      min-width: 0;
    }

    .jarvis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    /* Fast Native Scroll Container */
    .chat-box {
      flex: 1;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 88%;
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background: var(--msg-user-bg);
      border: 1px solid var(--msg-user-border);
    }

    .bot-msg {
      align-self: flex-start;
      background: var(--msg-bot-bg);
      border: 1px solid var(--msg-bot-border);
    }

    .input-container {
      display: flex;
      gap: 8px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      outline: none;
    }

    .send-btn {
      background: var(--btn-bg);
      border: none;
      color: #fff;
      font-weight: bold;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .history-panel { display: none; }
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="fg-jarvis-orb"></div>
  </div>

  <div class="app-layout">
    <div class="glass-card history-panel">
      <div class="history-header">
        <span>Chats</span>
        <button onclick="clearAllSessions()" style="background:none; border:none; color:#ff5555; cursor:pointer;">Clear</button>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="glass-card chat-section">
      <div class="jarvis-header">
        <h3 style="color:var(--text-sub);">J.A.R.V.I.S.</h3>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-container">
        <input type="text" id="userInput" placeholder="Ask something..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button class="send-btn" onclick="sendQuery()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = null;

    window.onload = function() {
      let sessions = getSessions();
      if (sessions.length === 0) startNewChat();
      else loadSession(sessions[0].id);
    };

    function getSessions() {
      return JSON.parse(localStorage.getItem('jarvis_sessions') || '[]');
    }

    function saveSessions(sessions) {
      localStorage.setItem('jarvis_sessions', JSON.stringify(sessions));
      renderHistoryList();
    }

    function startNewChat() {
      currentSessionId = 'session_' + Date.now();
      let sessions = getSessions();
      sessions.unshift({
        id: currentSessionId,
        title: 'New Chat',
        messages: [{ sender: 'bot', text: 'Greetings! How may I assist you today?' }]
      });
      saveSessions(sessions);
      loadSession(currentSessionId);
    }

    function loadSession(id) {
      currentSessionId = id;
      let session = getSessions().find(s => s.id === id);
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      if (session) {
        session.messages.forEach(msg => appendMessageUI(msg.text, msg.sender === 'user' ? 'user-msg' : 'bot-msg'));
      }
      renderHistoryList();
    }

    async function sendQuery() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessageUI(text, 'user-msg');
      saveMessageToSession(text, 'user');
      input.value = '';

      try {
        const response = await fetch('/api/jarvis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await response.json();
        const reply = data.reply || "No response received.";
        appendMessageUI(reply, 'bot-msg');
        saveMessageToSession(reply, 'bot');
      } catch (err) {
        appendMessageUI("Connection error.", 'bot-msg');
      }
    }

    function appendMessageUI(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function saveMessageToSession(text, sender) {
      let sessions = getSessions();
      let session = sessions.find(s => s.id === currentSessionId);
      if (session) {
        if (session.title === 'New Chat' && sender === 'user') {
          session.title = text.length > 20 ? text.substring(0, 20) + '...' : text;
        }
        session.messages.push({ sender, text });
        saveSessions(sessions);
      }
    }

    function renderHistoryList() {
      const historyList = document.getElementById('historyList');
      if (!historyList) return;
      historyList.innerHTML = '';
      getSessions().forEach(s => {
        const div = document.createElement('div');
        div.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
        div.textContent = s.title;
        div.onclick = () => loadSession(s.id);
        historyList.appendChild(div);
      });
    }

    function clearAllSessions() {
      localStorage.removeItem('jarvis_sessions');
      startNewChat();
    }
  </script>
</body>
</html>
