<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Educational AI Assistant</title>
  
  <style>
    :root {
      /* Dark Theme */
      --bg-gradient: radial-gradient(circle at 50% 20%, #100626 0%, #04060a 100%);
      --card-bg: rgba(18, 18, 30, 0.7);
      --card-border: rgba(0, 212, 255, 0.3);
      --text-main: #e0f7fa;
      --text-sub: #00d4ff;
      --msg-user-bg: linear-gradient(135deg, rgba(0, 212, 255, 0.35), rgba(112, 0, 255, 0.35));
      --msg-user-border: rgba(0, 212, 255, 0.5);
      --msg-bot-bg: rgba(255, 255, 255, 0.08);
      --msg-bot-border: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(0, 0, 0, 0.5);
      --accent-glow: 0 0 25px rgba(0, 212, 255, 0.6);
      --btn-bg: linear-gradient(135deg, #00d4ff, #7000ff);
      --btn-text: #ffffff;
    }

    [data-theme="light"] {
      /* Light Theme */
      --bg-gradient: radial-gradient(circle at 50% 20%, #e0c3fc 0%, #8ec5fc 100%);
      --card-bg: rgba(255, 255, 255, 0.8);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-main: #1e1e2f;
      --text-sub: #4a00e0;
      --msg-user-bg: linear-gradient(135deg, #8e2de2, #4a00e0);
      --msg-user-border: rgba(142, 45, 226, 0.3);
      --msg-bot-bg: rgba(255, 255, 255, 0.9);
      --msg-bot-border: rgba(255, 255, 255, 0.95);
      --input-bg: rgba(255, 255, 255, 0.9);
      --accent-glow: 0 0 20px rgba(142, 45, 226, 0.4);
      --btn-bg: linear-gradient(135deg, #8e2de2, #4a00e0);
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Floating JARVIS Arc Background Elements */
    .bg-jarvis-orb-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      border: 3px dashed var(--text-sub);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
      animation: floatOrbit1 22s ease-in-out infinite alternate, spinCW 35s linear infinite;
    }

    .bg-jarvis-orb-2 {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 2px dotted rgba(112, 0, 255, 0.6);
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
      animation: floatOrbit2 16s ease-in-out infinite alternate, spinCCW 25s linear infinite;
    }

    @keyframes floatOrbit1 {
      0% { transform: translate(-35vw, -25vh) scale(0.9); }
      50% { transform: translate(30vw, 20vh) scale(1.15); }
      100% { transform: translate(-15vw, 30vh) scale(0.85); }
    }

    @keyframes floatOrbit2 {
      0% { transform: translate(30vw, -30vh) scale(1.1); }
      50% { transform: translate(-25vw, -10vh) scale(0.8); }
      100% { transform: translate(20vw, 35vh) scale(1.2); }
    }

    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    /* Layout Setup */
    .app-layout {
      position: relative;
      z-index: 1;
      width: 95%;
      max-width: 1000px;
      height: 90vh;
      display: flex;
      gap: 15px;
    }

    /* Glassmorphism Outer Card */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      border-radius: 24px;
    }

    /* History Sidebar */
    .history-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      padding: 18px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      color: var(--text-sub);
    }

    .new-chat-btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: var(--accent-glow);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }

    .history-item:hover, .history-item.active {
      border-color: var(--card-border);
      background: rgba(255, 255, 255, 0.15);
    }

    /* Main Chat Section */
    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      min-width: 0; /* Prevents layout clipping */
    }

    /* Header & Controls */
    .jarvis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Animated JARVIS Core */
    .arc-reactor {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px dashed var(--text-sub);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--accent-glow);
      animation: spinReactor 12s linear infinite;
    }

    .arc-core {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--btn-bg);
      box-shadow: var(--accent-glow);
      animation: pulseCore 2s ease-in-out infinite alternate;
    }

    @keyframes spinReactor {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseCore {
      0% { transform: scale(0.8); opacity: 0.7; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    /* Action Buttons */
    .controls {
      display: flex;
      gap: 8px;
    }

    .theme-btn, .clear-btn, .mobile-history-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .mobile-history-btn { display: none; }

    /* Smooth Scrolling Chat Box */
    .chat-box {
      flex: 1;
      overflow-y: scroll;
      scroll-behavior: smooth;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 8px;
    }

    .message {
      padding: 12px 18px;
      border-radius: 16px;
      max-width: 85%;
      font-size: 0.95rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-msg {
      align-self: flex-end;
      background: var(--msg-user-bg);
      border: 1px solid var(--msg-user-border);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot-msg {
      align-self: flex-start;
      background: var(--msg-bot-bg);
      border: 1px solid var(--msg-bot-border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    /* Input Controls */
    .input-container {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      color: var(--text-main);
      outline: none;
    }

    .send-btn {
      background: var(--btn-bg);
      border: none;
      color: var(--btn-text);
      font-weight: bold;
      padding: 0 20px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--accent-glow);
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .mobile-history-btn { display: block; }

      .history-panel {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: none;
      }

      .history-panel.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Floating Ambient JARVIS Background Orbs -->
  <div class="bg-jarvis-orb-1"></div>
  <div class="bg-jarvis-orb-2"></div>

  <div class="app-layout">
    <!-- History Sidebar -->
    <div class="glass-card history-panel" id="historyPanel">
      <div class="history-header">
        <span>Chat Sessions</span>
        <button class="clear-btn" onclick="clearAllSessions()">Clear All</button>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
      <div class="history-list" id="historyList"></div>
    </div>

    <!-- Main JARVIS Section -->
    <div class="glass-card chat-section">
      <div class="jarvis-header">
        <div class="header-left">
          <div class="arc-reactor">
            <div class="arc-core"></div>
          </div>
          <div>
            <h2 style="font-size: 1.1rem;">J.A.R.V.I.S.</h2>
            <p style="font-size: 0.75rem; color: var(--text-sub);">Educational Intelligence</p>
          </div>
        </div>
        <div class="controls">
          <button class="mobile-history-btn" onclick="toggleMobileHistory()">📜 Chats</button>
          <button class="theme-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light</button>
        </div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-container">
        <input type="text" id="userInput" placeholder="Ask any question..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button class="send-btn" onclick="sendQuery()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = null;

    window.onload = function() {
      let sessions = getSessions();
      if (sessions.length === 0) {
        startNewChat();
      } else {
        loadSession(sessions[0].id);
      }
    };

    function toggleMobileHistory() {
      document.getElementById('historyPanel').classList.toggle('active');
    }

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('themeToggleBtn');
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        themeBtn.textContent = '☀️ Light';
      } else {
        body.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙 Dark';
      }
    }

    /* Session Management (Gemini-style Chat Threads) */
    function getSessions() {
      return JSON.parse(localStorage.getItem('jarvis_sessions') || '[]');
    }

    function saveSessions(sessions) {
      localStorage.setItem('jarvis_sessions', JSON.stringify(sessions));
      renderHistoryList();
    }

    function startNewChat() {
      currentSessionId = 'session_' + Date.now();
      let sessions = getSessions();
      sessions.unshift({
        id: currentSessionId,
        title: 'New Conversation',
        messages: [{ sender: 'bot', text: 'Greetings! I am JARVIS. How may I assist your studies today?' }]
      });
      saveSessions(sessions);
      loadSession(currentSessionId);
      if (window.innerWidth <= 768) {
        document.getElementById('historyPanel').classList.remove('active');
      }
    }

    function loadSession(id) {
      currentSessionId = id;
      let sessions = getSessions();
      let session = sessions.find(s => s.id === id);
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      if (session) {
        session.messages.forEach(msg => {
          appendMessageUI(msg.text, msg.sender === 'user' ? 'user-msg' : 'bot-msg');
        });
      }
      renderHistoryList();
    }

    async function sendQuery() {
      const inputField = document.getElementById('userInput');
      const text = inputField.value.trim();
      if (!text) return;

      appendMessageUI(text, 'user-msg');
      saveMessageToSession(text, 'user');
      inputField.value = '';

      try {
        const response = await fetch('/api/jarvis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        const reply = data.reply || "Systems standard response.";
        
        appendMessageUI(reply, 'bot-msg');
        saveMessageToSession(reply, 'bot');
        speak(reply);

      } catch (err) {
        appendMessageUI("Central command connection failed.", 'bot-msg');
      }
    }

    function appendMessageUI(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);

      // Smooth, non-blocking auto-scroll to bottom
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    }

    function saveMessageToSession(text, sender) {
      let sessions = getSessions();
      let session = sessions.find(s => s.id === currentSessionId);
      if (session) {
        // Set title from the first user question
        if (session.title === 'New Conversation' && sender === 'user') {
          session.title = text.length > 28 ? text.substring(0, 28) + '...' : text;
        }
        session.messages.push({ sender, text });
        saveSessions(sessions);
      }
    }

    function renderHistoryList() {
      const historyList = document.getElementById('historyList');
      let sessions = getSessions();
      historyList.innerHTML = '';

      sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
        div.textContent = s.title;
        div.onclick = () => {
          loadSession(s.id);
          if (window.innerWidth <= 768) {
            document.getElementById('historyPanel').classList.remove('active');
          }
        };
        historyList.appendChild(div);
      });
    }

    function clearAllSessions() {
      localStorage.removeItem('jarvis_sessions');
      startNewChat();
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const softVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha'))) || voices[0];

      if (softVoice) utterance.voice = softVoice;
      utterance.pitch = 1.0;
      utterance.rate = 0.95;

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
