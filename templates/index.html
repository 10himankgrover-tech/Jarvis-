<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Educational AI Assistant</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
      color: #e0f7fa;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Glassmorphism Container */
    .glass-card {
      width: 90%;
      max-width: 650px;
      height: 85vh;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    /* Animated JARVIS Arc Reactor Header */
    .jarvis-header {
      display: flex;
      align-items: center;
      gap: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .orb {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: radial-gradient(circle, #00d4ff 0%, rgba(9,9,121,0.2) 70%);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 212, 255, 0.8); }
      100% { transform: scale(0.95); box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); }
    }

    /* Chat Display Area */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 5px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      max-width: 80%;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .user-msg {
      align-self: flex-end;
      background: rgba(0, 212, 255, 0.2);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: #fff;
    }

    .bot-msg {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e0f7fa;
    }

    /* Input Controls */
    .input-container {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      outline: none;
    }

    button {
      background: #00d4ff;
      border: none;
      color: #090a0f;
      font-weight: bold;
      padding: 0 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #70e4ff;
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <div class="jarvis-header">
      <div class="orb"></div>
      <div>
        <h2>J.A.R.V.I.S.</h2>
        <p style="font-size: 0.8rem; opacity: 0.7;">Educational Assistant Active</p>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot-msg">Hello! Systems are online. Ask me any study question!</div>
    </div>

    <div class="input-container">
      <input type="text" id="userInput" placeholder="Ask JARVIS a question..." onkeydown="if(event.key==='Enter') sendQuery()">
      <button onclick="sendQuery()">Send</button>
    </div>
  </div>

  <script>
    // Load local history on page load
    window.onload = function() {
      loadHistory();
    };

    async function sendQuery() {
      const inputField = document.getElementById('userInput');
      const text = inputField.value.trim();
      if (!text) return;

      appendMessage(text, 'user-msg');
      inputField.value = '';

      try {
        const response = await fetch('/api/jarvis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        const reply = data.reply || "Systems standard response.";
        
        appendMessage(reply, 'bot-msg');
        speak(reply);
        saveHistory(text, reply);

      } catch (err) {
        appendMessage("Central command connection failed.", 'bot-msg');
      }
    }

    function appendMessage(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* Soft Clear Speech Output */
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const softVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha'))) || voices[0];

      if (softVoice) utterance.voice = softVoice;
      utterance.pitch = 1.0;
      utterance.rate = 0.95; // Slightly slower pacing for soft clarity

      window.speechSynthesis.speak(utterance);
    }

    /* Browser localStorage Search History */
    function saveHistory(prompt, response) {
      let history = JSON.parse(localStorage.getItem('jarvis_student_history') || '[]');
      history.push({ prompt, response, timestamp: new Date().toISOString() });
      localStorage.setItem('jarvis_student_history', JSON.stringify(history));
    }

    function loadHistory() {
      let history = JSON.parse(localStorage.getItem('jarvis_student_history') || '[]');
      history.forEach(item => {
        appendMessage(item.prompt, 'user-msg');
        appendMessage(item.response, 'bot-msg');
      });
    }
  </script>
</body>
</html>
