<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Jarvis — AI Assistant</title>

  <!-- DEBUG BANNER: shows JavaScript problems on screen. Delete this whole script block once everything works. -->
  <script>
    (function () {
      function banner(msg) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;padding:10px;font:13px/1.4 monospace;white-space:pre-wrap;word-break:break-word';
        d.textContent = msg;
        document.documentElement.appendChild(d);
      }
      window.addEventListener('error', function (e) {
        banner('JS error: ' + e.message + '\nLine ' + e.lineno + ', column ' + e.colno);
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__jarvisReady) {
            banner('The main script did not finish starting. A template file may be cut off or edited.');
          } else if (typeof html2pdf === 'undefined') {
            banner('The PDF library did not load. Check your internet or ad blocker.');
          }
        }, 1500);
      });
    })();
  </script>

  <!-- PDF engine (runs in the browser, free, no server load) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- The page styles live in templates/style.css -->
  <style>
{% include 'style.css' %}
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="fg-jarvis-orb-1"></div>
    <div class="fg-jarvis-orb-2"></div>
  </div>

  <div class="app-layout">
    <div class="glass-card history-panel" id="historyPanel">
      <div class="history-header">
        <span>Chat Sessions</span>
        <div class="history-actions">
          <button class="clear-btn" onclick="clearAllSessions()">Clear All</button>
          <button class="clear-btn mobile-close-btn" onclick="toggleMobileHistory()">✕ Close</button>
        </div>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="glass-card chat-section">
      <div class="jarvis-header">
        <div class="header-left">
          <div class="arc-reactor">
            <div class="arc-core"></div>
          </div>
          <div>
            <h2 style="font-size: 1.05rem;">
              Jarvis
              <span class="status-dot" id="statusDot" title="Checking connection..."></span>
            </h2>
            <p style="font-size: 0.72rem; color: var(--text-sub);" id="modeSubtitle">AI Assistant</p>
          </div>
        </div>
        <div class="controls">
          <select class="pill-select" id="modeSelect" onchange="setMode(this.value)" title="Choose how Jarvis behaves">
            <option value="chat">💬 Chat</option>
            <option value="study">📘 Study</option>
            <option value="code">💻 Code</option>
            <option value="writer">✍️ Writer</option>
          </select>
          <select class="pill-select" id="pdfThemeSelect" onchange="setPdfTheme(this.value)" title="Colors for your PDF notes">
            <option value="ocean">🎨 Ocean</option>
            <option value="sunset">🎨 Sunset</option>
            <option value="forest">🎨 Forest</option>
            <option value="grape">🎨 Grape</option>
          </select>
          <button class="theme-btn" id="thinkToggleBtn" onclick="toggleThinking()" title="Ask Jarvis to reason more carefully">🧠 Think harder</button>
          <button class="voice-btn" onclick="toggleVoice()" id="voiceToggleBtn">🔊 Voice ON</button>
          <button class="theme-btn" onclick="stopSpeaking()" title="Stop Jarvis from speaking">🔇 Stop voice</button>
          <button class="mobile-history-btn" onclick="toggleMobileHistory()">📜 Chats</button>
          <button class="theme-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light</button>
        </div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="starter-row" id="starterRow"></div>

      <div id="photoPreviewRow" class="photo-preview-row" style="display:none;">
        <img id="photoPreviewImg" alt="Attached photo preview">
        <span id="photoPreviewName"></span>
        <button type="button" onclick="clearAttachedPhoto()" title="Remove photo">✕</button>
      </div>

      <div class="input-container">
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="onPhotoChosen(this.files[0])">
        <button class="mic-btn" id="cameraBtn" onclick="document.getElementById('photoInput').click()" title="Add a photo">📷</button>
        <input type="text" id="userInput" placeholder="Ask Jarvis anything..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button class="mic-btn" id="micBtn" onclick="startListening()" title="Speak to Jarvis">🎤</button>
        <button class="send-btn" id="sendBtn" onclick="sendQuery()">Send</button>
        <button class="send-btn stop-btn" id="stopBtn" onclick="stopStreaming()" style="display:none;">Stop</button>
      </div>
    </div>
  </div>

  <!-- Chat logic, sessions, modes, voice: templates/app.js -->
  <script>
{% include 'app.js' %}
  </script>
  <!-- Streaming replies + Markdown rendering: templates/stream.js -->
  <script>
{% include 'stream.js' %}
  </script>
  <!-- Colorful PDF notes: templates/pdf.js -->
  <script>
{% include 'pdf.js' %}
  </script>
</body>
</html>
