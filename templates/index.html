<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Jarvis — AI Assistant</title>

  <!-- DEBUG BANNER: shows JavaScript problems on screen. Delete this whole script block once everything works. -->
  <script>
    (function () {
      function banner(msg) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#b00020;color:#fff;padding:10px;font:13px/1.4 monospace;white-space:pre-wrap;word-break:break-word';
        d.textContent = msg;
        document.documentElement.appendChild(d);
      }
      window.addEventListener('error', function (e) {
        banner('JS error: ' + e.message + '\nLine ' + e.lineno + ', column ' + e.colno);
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__jarvisReady) {
            banner('The main script did not finish starting. A template file may be cut off or edited.');
          } else if (typeof html2pdf === 'undefined') {
            banner('The PDF library did not load. Check your internet or ad blocker.');
          }
        }, 1500);
      });
    })();
  </script>

  <!-- PDF engine (runs in the browser, free, no server load) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- The page styles live in templates/style.css -->
  <style>
{% include 'style.css' %}
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="fg-orb fg-orb-cyan"></div>
    <div class="fg-orb fg-orb-purple"></div>
    <div class="fg-orb fg-orb-pink"></div>
  </div>

  <div class="app-layout">
    <div class="glass-card history-panel" id="historyPanel">
      <div class="history-header">
        <span>Chats</span>
        <div class="history-actions">
          <button class="icon-btn small" onclick="clearAllSessions()" title="Clear all">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
          </button>
          <button class="icon-btn small mobile-close-btn" onclick="toggleMobileHistory()" title="Close">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="glass-card chat-section">
      <div class="jarvis-header">
        <div class="header-left">
          <div class="arc-reactor">
            <div class="arc-core"></div>
          </div>
          <div>
            <h2 style="font-size: 1.05rem;">
              Jarvis
              <span class="status-dot" id="statusDot" title="Checking connection..."></span>
            </h2>
            <p style="font-size: 0.72rem; color: var(--text-sub);" id="modeSubtitle">AI Assistant</p>
          </div>
        </div>
        <div class="header-right">
          <button class="icon-btn mobile-history-btn" id="chatsToggleBtn" onclick="toggleMobileHistory()" title="Chats">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3.5-7.1M21 4v5h-5"/></svg>
          </button>
          <button class="icon-btn" id="settingsToggleBtn" onclick="toggleSettings()" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9.1A1.7 1.7 0 0 0 10.14 3H10a2 2 0 0 1 4 0v.09c0 .68.39 1.28 1.04 1.56.63.26 1.36.13 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06c-.47.51-.6 1.24-.34 1.87.28.65.88 1.04 1.56 1.04H21a2 2 0 0 1 0 4h-.09c-.68 0-1.28.39-1.56 1.04z"/></svg>
          </button>
        </div>
      </div>

      <!-- Settings drawer: everything that used to crowd the header lives here now -->
      <div class="settings-backdrop" id="settingsBackdrop" onclick="closeSettings()"></div>
      <div class="settings-drawer glass-card" id="settingsDrawer">
        <div class="drawer-handle"></div>
        <div class="drawer-title">Settings</div>

        <div class="drawer-row">
          <span class="drawer-row-label">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Mode
          </span>
          <select class="pill-select" id="modeSelect" onchange="setMode(this.value)">
            <option value="chat">Chat</option>
            <option value="study">Study</option>
            <option value="code">Code</option>
            <option value="writer">Writer</option>
          </select>
        </div>

        <div class="drawer-row">
          <span class="drawer-row-label">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1"/><circle cx="14" cy="9" r="1"/><circle cx="15" cy="14" r="1"/><path d="M12 3a9 9 0 0 0 0 18c1 0 1.5-.7 1.5-1.5S13 18 13 17a2 2 0 0 1 2-2h1.5A3.5 3.5 0 0 0 20 11.5 9 9 0 0 0 12 3z"/></svg>
            PDF colors
          </span>
          <select class="pill-select" id="pdfThemeSelect" onchange="setPdfTheme(this.value)">
            <option value="ocean">Ocean</option>
            <option value="sunset">Sunset</option>
            <option value="forest">Forest</option>
            <option value="grape">Grape</option>
          </select>
        </div>

        <div class="drawer-row">
          <span class="drawer-row-label">
            <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
            Think harder
          </span>
          <button class="switch" id="thinkToggleBtn" onclick="toggleThinking()"><span class="switch-knob"></span></button>
        </div>

        <div class="drawer-row">
          <span class="drawer-row-label">
            <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg>
            Voice replies
          </span>
          <button class="switch active" id="voiceToggleBtn" onclick="toggleVoice()"><span class="switch-knob"></span></button>
        </div>

        <button class="drawer-action-btn" onclick="stopSpeaking()">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>
          Stop voice now
        </button>

        <div class="drawer-row">
          <span class="drawer-row-label">
            <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
            Light theme
          </span>
          <button class="switch" id="themeToggleSwitch" onclick="toggleTheme()"><span class="switch-knob"></span></button>
        </div>

        <button class="drawer-action-btn danger" onclick="clearAllSessions()">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/></svg>
          Clear all chats
        </button>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="starter-row" id="starterRow"></div>

      <div id="photoPreviewRow" class="photo-preview-row" style="display:none;">
        <img id="photoPreviewImg" alt="Attached photo preview">
        <span id="photoPreviewName"></span>
        <button type="button" class="icon-btn small" onclick="clearAttachedPhoto()" title="Remove photo">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="input-container">
        <div class="plus-wrap">
          <button class="icon-btn plus-btn" id="plusBtn" onclick="togglePlusMenu()" title="Add">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <div class="plus-menu glass-card" id="plusMenu">
            <button class="plus-menu-item" onclick="document.getElementById('photoInput').click(); closePlusMenu();">
              <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h1.5l1-1.5h7l1 1.5H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
              Add a photo
            </button>
            <button class="plus-menu-item disabled" disabled>
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="m21 15-5-5-9 9"/></svg>
              Create an image
              <span class="soon-badge">Soon</span>
            </button>
          </div>
        </div>

        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" onchange="onPhotoChosen(this.files[0])">
        <input type="text" id="userInput" placeholder="Ask Jarvis anything..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button class="icon-btn" id="micBtn" onclick="startListening()" title="Speak to Jarvis">
          <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
        </button>
        <button class="icon-btn send-btn" id="sendBtn" onclick="sendQuery()" title="Send">
          <svg viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
        <button class="icon-btn send-btn stop-btn" id="stopBtn" onclick="stopStreaming()" style="display:none;" title="Stop">
          <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Chat logic, sessions, modes, voice: templates/app.js -->
  <script>
{% include 'app.js' %}
  </script>
  <!-- Streaming replies + Markdown rendering: templates/stream.js -->
  <script>
{% include 'stream.js' %}
  </script>
  <!-- Colorful PDF notes: templates/pdf.js -->
  <script>
{% include 'pdf.js' %}
  </script>
</body>
</html>
