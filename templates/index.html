<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JARVIS — Educational AI Assistant</title>
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #100626 0%, #04060a 100%);
      --card-bg: rgba(18, 18, 30, 0.85);
      --card-border: rgba(0, 212, 255, 0.35);
      --text-main: #e0f7fa;
      --text-sub: #00d4ff;
      --msg-user-bg: linear-gradient(135deg, rgba(0, 212, 255, 0.35), rgba(112, 0, 255, 0.35));
      --msg-user-border: rgba(0, 212, 255, 0.5);
      --msg-bot-bg: rgba(255, 255, 255, 0.08);
      --msg-bot-border: rgba(255, 255, 255, 0.15);
      --input-bg: rgba(0, 0, 0, 0.6);
      --accent-glow: 0 0 25px rgba(0, 212, 255, 0.6);
      --btn-bg: linear-gradient(135deg, #00d4ff, #7000ff);
      --btn-text: #ffffff;
    }

    [data-theme="light"] {
      --bg-gradient: radial-gradient(circle at 50% 20%, #e0c3fc 0%, #8ec5fc 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.95);
      --text-main: #1e1e2f;
      --text-sub: #4a00e0;
      --msg-user-bg: linear-gradient(135deg, #8e2de2, #4a00e0);
      --msg-user-border: rgba(142, 45, 226, 0.3);
      --msg-bot-bg: rgba(255, 255, 255, 0.9);
      --msg-bot-border: rgba(255, 255, 255, 0.95);
      --input-bg: rgba(255, 255, 255, 0.9);
      --accent-glow: 0 0 20px rgba(142, 45, 226, 0.4);
      --btn-bg: linear-gradient(135deg, #8e2de2, #4a00e0);
      --btn-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg-gradient);
      color: var(--text-main);
    }

    /* Floating Animated Circles */
    .overlay-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .fg-jarvis-orb-1 {
      position: absolute;
      width: 300px;
      height: 300px;
      top: 10%;
      left: 10%;
      border-radius: 50%;
      border: 2px dashed var(--text-sub);
      opacity: 0.25;
      animation: floatLoop1 20s linear infinite;
    }

    .fg-jarvis-orb-2 {
      position: absolute;
      width: 200px;
      height: 200px;
      bottom: 15%;
      right: 10%;
      border-radius: 50%;
      border: 2px dotted rgba(112, 0, 255, 0.7);
      opacity: 0.3;
      animation: floatLoop2 16s linear infinite;
    }

    @keyframes floatLoop1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(30vw, 20vh) rotate(120deg); }
      66% { transform: translate(-10vw, 40vh) rotate(240deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }

    @keyframes floatLoop2 {
      0% { transform: translate(0, 0) rotate(360deg); }
      33% { transform: translate(-25vw, -30vh) rotate(240deg); }
      66% { transform: translate(15vw, -15vh) rotate(120deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .app-layout {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      height: 100dvh;
      margin: 0 auto;
      padding: 10px;
      display: flex;
      gap: 12px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      border-radius: 20px;
    }

    .history-panel {
      width: 260px;
      display: flex;
      flex-direction: column;
      padding: 16px;
      flex-shrink: 0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: bold;
      color: var(--text-sub);
    }

    .new-chat-btn {
      width: 100%;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: var(--accent-glow);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }

    .history-item:hover, .history-item.active {
      border-color: var(--card-border);
      background: rgba(255, 255, 255, 0.15);
    }

    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      min-width: 0;
      height: 100%;
      overflow: hidden;
    }

    .jarvis-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .arc-reactor {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px dashed var(--text-sub);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: var(--accent-glow);
      animation: spinReactor 12s linear infinite;
    }

    .arc-core {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--btn-bg);
      box-shadow: var(--accent-glow);
      animation: pulseCore 2s ease-in-out infinite alternate;
    }

    @keyframes spinReactor { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseCore { 0% { transform: scale(0.8); opacity: 0.7; } 100% { transform: scale(1.1); opacity: 1; } }

    .controls { display: flex; gap: 6px; flex-wrap: wrap; }

    .theme-btn, .voice-btn, .clear-btn, .mobile-history-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .mobile-history-btn { display: none; }

    .chat-box {
      flex: 1 1 0%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-right: 6px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 85%;
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background: var(--msg-user-bg);
      border: 1px solid var(--msg-user-border);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot-msg {
      align-self: flex-start;
      background: var(--msg-bot-bg);
      border: 1px solid var(--msg-bot-border);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
    }

    .input-container {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }

    .send-btn {
      background: var(--btn-bg);
      border: none;
      color: var(--btn-text);
      font-weight: bold;
      padding: 0 18px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--accent-glow);
    }

    @media (max-width: 768px) {
      .mobile-history-btn { display: block; }
      .history-panel {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
        display: none;
      }
      .history-panel.active { display: flex; }
    }
  </style>
</head>
<body>

  <div class="overlay-container">
    <div class="fg-jarvis-orb-1"></div>
    <div class="fg-jarvis-orb-2"></div>
  </div>

  <div class="app-layout">
    <div class="glass-card history-panel" id="historyPanel">
      <div class="history-header">
        <span>Chat Sessions</span>
        <button class="clear-btn" onclick="clearAllSessions()">Clear All</button>
      </div>
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="glass-card chat-section">
      <div class="jarvis-header">
        <div class="header-left">
          <div class="arc-reactor">
            <div class="arc-core"></div>
          </div>
          <div>
            <h2 style="font-size: 1.05rem;">J.A.R.V.I.S.</h2>
            <p style="font-size: 0.72rem; color: var(--text-sub);">Educational Intelligence</p>
          </div>
        </div>
        <div class="controls">
          <button class="voice-btn" onclick="toggleVoice()" id="voiceToggleBtn">🔊 Voice ON</button>
          <button class="mobile-history-btn" onclick="toggleMobileHistory()">📜 Chats</button>
          <button class="theme-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️ Light</button>
        </div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-container">
        <input type="text" id="userInput" placeholder="Ask any question..." onkeydown="if(event.key==='Enter') sendQuery()">
        <button class="send-btn" onclick="sendQuery()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = null;
    let voiceEnabled = true;

    window.onload = function() {
      let sessions = getSessions();
      if (sessions.length === 0) {
        startNewChat();
      } else {
        loadSession(sessions[0].id);
      }
    };

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      const voiceBtn = document.getElementById('voiceToggleBtn');
      if (voiceEnabled) {
        voiceBtn.textContent = '🔊 Voice ON';
        voiceBtn.style.opacity = '1';
      } else {
        voiceBtn.textContent = '🔇 Muted';
        voiceBtn.style.opacity = '0.6';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function toggleMobileHistory() {
      document.getElementById('historyPanel').classList.toggle('active');
    }

    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById('themeToggleBtn');
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        themeBtn.textContent = '☀️ Light';
      } else {
        body.setAttribute('data-theme', 'light');
        themeBtn.textContent = '🌙 Dark';
      }
    }

    function getSessions() {
      return JSON.parse(localStorage.getItem('jarvis_sessions') || '[]');
    }

    function saveSessions(sessions) {
      localStorage.setItem('jarvis_sessions', JSON.stringify(sessions));
      renderHistoryList();
    }

    function startNewChat() {
      currentSessionId = 'session_' + Date.now();
      let sessions = getSessions();
      const initialGreeting = 'Greetings! I am JARVIS. How may I assist your studies today?';
      sessions.unshift({
        id: currentSessionId,
        title: 'New Conversation',
        messages: [{ sender: 'bot', text: initialGreeting }]
      });
      saveSessions(sessions);
      loadSession(currentSessionId);
      if (window.innerWidth <= 768) {
        document.getElementById('historyPanel').classList.remove('active');
      }
    }

    function loadSession(id) {
      currentSessionId = id;
      let sessions = getSessions();
      let session = sessions.find(s => s.id === id);
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      if (session) {
        session.messages.forEach(msg => {
          appendMessageUI(msg.text, msg.sender === 'user' ? 'user-msg' : 'bot-msg');
        });
      }
      renderHistoryList();
    }

    async function sendQuery() {
      const inputField = document.getElementById('userInput');
      const text = inputField.value.trim();
      if (!text) return;

      appendMessageUI(text, 'user-msg');
      saveMessageToSession(text, 'user');
      inputField.value = '';

      try {
        const response = await fetch('/api/jarvis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });

        const data = await response.json();
        const rawResponse = JSON.stringify(data);

        if (response.status === 429 || rawResponse.includes("429") || rawResponse.includes("RESOURCE_EXHAUSTED")) {
          const quotaText = "JARVIS is recharging, please wait 60 seconds.";
          appendMessageUI(quotaText, 'bot-msg');
          saveMessageToSession(quotaText, 'bot');
          speak(quotaText);
          return;
        }

        const reply = data.reply || data.error || "Systems standard response.";
        appendMessageUI(reply, 'bot-msg');
        saveMessageToSession(reply, 'bot');
        speak(reply);

      } catch (err) {
        const errorMsg = "Central command connection failed.";
        appendMessageUI(errorMsg, 'bot-msg');
        speak(errorMsg);
      }
    }

    function appendMessageUI(text, className) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${className}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);

      setTimeout(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 50);
    }

    function saveMessageToSession(text, sender) {
      let sessions = getSessions();
      let session = sessions.find(s => s.id === currentSessionId);
      if (session) {
        if (session.title === 'New Conversation' && sender === 'user') {
          session.title = text.length > 28 ? text.substring(0, 28) + '...' : text;
        }
        session.messages.push({ sender, text });
        saveSessions(sessions);
      }
    }

    function renderHistoryList() {
      const historyList = document.getElementById('historyList');
      if (!historyList) return;
      let sessions = getSessions();
      historyList.innerHTML = '';

      sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = `history-item ${s.id === currentSessionId ? 'active' : ''}`;
        div.textContent = s.title;
        div.onclick = () => {
          loadSession(s.id);
          if (window.innerWidth <= 768) {
            document.getElementById('historyPanel').classList.remove('active');
          }
        };
        historyList.appendChild(div);
      });
    }

    function clearAllSessions() {
      localStorage.removeItem('jarvis_sessions');
      startNewChat();
    }

    /* High Quality ElevenLabs Voice Integration */
    async function speak(text) {
      if (!voiceEnabled) return;

      const ELEVENLABS_API_KEY = "YOUR_ELEVENLABS_API_KEY_HERE"; 
      const VOICE_ID = "pNInz6obpgDQGcFmaJgB"; // Default: Adam (Clear Male Voice)

      // Fallback to Web Speech if no key is provided
      if (ELEVENLABS_API_KEY === "YOUR_ELEVENLABS_API_KEY_HERE") {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
        return;
      }

      try {
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'xi-api-key': ELEVENLABS_API_KEY
          },
          body: JSON.stringify({
            text: text,
            model_id: 'eleven_monolingual_v1',
            voice_settings: { stability: 0.5, similarity_boost: 0.75 }
          })
        });

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        audio.play();
      } catch (e) {
        console.error("Voice output failed:", e);
      }
    }
  </script>
</body>
</html>
